name: Generate GitHub Profile Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          # Sections shown, in order. Dropped "community" and "repositories"
          # since they were mostly empty with only 1 public repo — the
          # contribution heatmap and achievement badges below look far more
          # impressive with limited history than a list full of zeros.
          base: header, activity, isocalendar, achievements

          # Bigger card, easier to read
          config_display: large
          config_timezone: Asia/Kolkata

          # Green-square contribution heatmap, full year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Gamified badges (account age, streaks, stars, etc.) — these
          # render nicely even with a shorter GitHub history
          plugin_achievements: yes
          plugin_achievements_threshold: C

          # Language breakdown — raised the timeout (was 15s, too short to
          # finish analysis, which is why it showed "0 Languages" before)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 25
          plugin_languages_limit: 8
